<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroChat - Connect to the Future</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.3);
            --gloss: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 50%);
            --primary: #0078d7;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1500622388414-8555a1042564?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The Glass Container */
        #app-container {
            width: 90%;
            max-width: 800px;
            height: 85vh;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        #app-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: var(--gloss);
            pointer-events: none;
            z-index: 2;
        }

        header {
            padding: 15px;
            text-align: center;
            background: rgba(0, 120, 215, 0.5);
            color: white;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.5) transparent;
        }

        /* Message Layout with Profile Picture */
        .message {
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            border: 1px solid white;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
            animation: fadeIn 0.3s ease;
            align-self: flex-start;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .message-content {
            display: flex;
            flex-direction: column;
        }

        .message .username {
            font-size: 0.8rem;
            font-weight: bold;
            color: #0078d7;
            margin-bottom: 3px;
        }

        /* Circular Profile Pictures */
        .pfp-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(0,0,0,0.1);
            background: #eee;
            flex-shrink: 0;
        }

        /* Special User Glow Effects */
        .glow-admin {
            color: #ff0055 !important;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.6), 0 0 15px rgba(255, 0, 85, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }

        /* Controls & Inputs */
        #controls {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.3);
            z-index: 10;
        }

        /* Drag and Drop Zone Style */
        #pfp-dropzone {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background: rgba(255,255,255,0.3);
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
        }

        #pfp-dropzone.dragover {
            background: rgba(0, 120, 215, 0.4);
            border-color: #0078d7;
            transform: scale(1.05);
        }

        #pfp-dropzone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #pfp-dropzone .drop-text {
            font-size: 0.6rem;
            color: #333;
            text-align: center;
            pointer-events: none;
            line-height: 1;
        }

        input {
            padding: 12px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.5);
            outline: none;
            background: rgba(255,255,255,0.9);
        }

        #username-input { width: 120px; }
        #message-input { flex: 1; }

        button {
            padding: 10px 25px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(180deg, #5ecfff 0%, #0078d7 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 120, 215, 0.3);
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            from { text-shadow: 0 0 8px rgba(255, 0, 85, 0.6), 0 0 15px rgba(255, 0, 85, 0.4); }
            to { text-shadow: 0 0 14px rgba(255, 0, 85, 0.9), 0 0 25px rgba(255, 0, 85, 0.6); }
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>AERO CHAT v1.0</header>
    
    <div id="chat-window">
        <div class="message">
            <img class="pfp-circle" src="https://api.dicebear.com/7.x/bottts/svg?seed=system" alt="PFP">
            <div class="message-content">
                <div class="username">System</div>
                <div>Welcome to the digital horizon. Drag an image onto the circle icon to set your profile picture, choose a name, and start chatting!</div>
            </div>
        </div>
    </div>

    <div id="controls">
        <div id="pfp-dropzone" title="Drag & Drop an image here to set your PFP">
            <div class="drop-text" id="dropzone-label">Drop<br>PFP</div>
        </div>
        
        <input type="text" id="username-input" placeholder="Display Name" value="User123">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button id="send-btn">Send</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // Configured with target database configuration
    const firebaseConfig = {
        authDomain: "aero-977a5.firebaseapp.com",
        databaseURL: "https://aero-977a5-default-rtdb.firebaseio.com/",
        projectId: "aero-977a5",
        storageBucket: "aero-977a5.appspot.com",
        messagingSenderId: "800936590653"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // UI Nodes
    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const usernameInput = document.getElementById('username-input');
    const sendBtn = document.getElementById('send-btn');
    const dropzone = document.getElementById('pfp-dropzone');
    const dropzoneLabel = document.getElementById('dropzone-label');

    // Default Fallback PFP string (Base64 placeholder or generated placeholder asset)
    let currentUserPfp = "https://api.dicebear.com/7.x/identicon/svg?seed=" + Math.random();

    // Check if current user is admin
    function isAdmin() {
        return usernameInput.value.trim() === "ADMIN12345";
    }

    // Drag and Drop Image Handlers
    ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
        }, false);
    });

    dropzone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;

        if (files.length > 0 && files[0].type.startsWith('image/')) {
            const reader = new FileReader();
            reader.readAsDataURL(files[0]);
            reader.onloadend = function() {
                currentUserPfp = reader.result;
                dropzone.innerHTML = `<img src="${currentUserPfp}" alt="Preview">`;
            }
        }
    });

    // Send Message / Parse Administrative Commands
    function sendMessage() {
        const text = messageInput.value.trim();
        const user = usernameInput.value.trim() || "Anonymous";

        if (text === "") return;

        // Command Routing
        if (text.startsWith('/') && isAdmin()) {
            handleAdminCommand(text);
            messageInput.value = "";
            return;
        }

        db.ref('messages').push({
            username: user,
            text: text,
            pfp: currentUserPfp,
            timestamp: Date.now()
        });
        messageInput.value = "";
    }

    // Process Command Logic safely
    function handleAdminCommand(commandString) {
        const args = commandString.split(' ');
        const command = args[0].toLowerCase();

        if (command === '/clear') {
            db.ref('messages').remove()
                .catch(err => console.error("Database deletion failed:", err));
        } 
        else if (command === '/alert') {
            const alertText = args.slice(1).join(' ');
            if (!alertText) return;
            
            db.ref('messages').push({
                username: "🚨 SYSTEM BROADCAST",
                text: alertText.toUpperCase(),
                pfp: "https://api.dicebear.com/7.x/initials/svg?seed=SYS",
                timestamp: Date.now()
            });
        }
    }

    // Listen for incoming database additions
    db.ref('messages').on('child_added', (snapshot) => {
        const data = snapshot.val();
        
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        
        // Match specific usernames to assign glowing dynamic filters
        let glowClass = "";
        if (data.username === "ADMIN12345") {
            glowClass = "glow-admin";
        }

        // Apply distinct formatting for system broadcast banners
        if (data.username === "🚨 SYSTEM BROADCAST") {
            msgDiv.style.background = "rgba(255, 70, 70, 0.2)";
            msgDiv.style.borderColor = "rgba(255, 0, 0, 0.4)";
        }

        // Generate element structures containing the circular image wrapper and message details
        const avatarUrl = data.pfp || "https://api.dicebear.com/7.x/identicon/svg?seed=default";
        msgDiv.innerHTML = `
            <img class="pfp-circle" src="${avatarUrl}" alt="User Avatar">
            <div class="message-content">
                <div class="username ${glowClass}">${data.username}</div>
                <div>${data.text}</div>
            </div>
        `;
        
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    });

    // Sync clear actions uniformly across external browsers
    db.ref('messages').on('value', (snapshot) => {
        if (!snapshot.exists()) {
            chatWindow.innerHTML = `
                <div class="message">
                    <img class="pfp-circle" src="https://api.dicebear.com/7.x/bottts/svg?seed=system" alt="PFP">
                    <div class="message-content">
                        <div class="username">System</div>
                        <div>The message logs were reset by an administrator.</div>
                    </div>
                </div>`;
        }
    });

    // Control listeners
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
