<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERO - Terminal Interface</title>
    <style>
        :root {
            --dark-green-bg: #041206;
            --panel-green: #0a240d;
            --terminal-green: #39ff14;
            --border-white: #ffffff;
            --white-glow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 18px rgba(255, 255, 255, 0.3);
            --green-glow: 0 0 8px rgba(57, 255, 20, 0.4);
            --steam-header: #020a03;
        }

        body, html {
            margin: 0; padding: 0; height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            background: var(--dark-green-bg); color: #e2f0e4;
            overflow: hidden; user-select: none;
        }

        /* --- CRT MONITOR SCANLINE SIMULATION --- */
        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(10, 30, 10, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999; background-size: 100% 3px, 4px 100%; pointer-events: none;
        }

        /* --- PS1 STYLE BOOT SEQUENCE ANIMATION CORES --- */
        #boot-screen {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; transition: background-color 2s ease;
        }

        #press-start {
            font-size: 1.5rem; letter-spacing: 5px; color: #fff;
            animation: blink 1s infinite; cursor: pointer; padding: 20px; border: 2px solid transparent;
        }
        #press-start:hover { border: 2px solid var(--border-white); box-shadow: var(--white-glow); }

        #boot-logo-1, #boot-logo-2 { display: none; opacity: 0; transition: opacity 1.5s ease; }
        #boot-logo-1 h1 { font-family: Arial, sans-serif; font-size: 3rem; color: #00ff33; letter-spacing: 10px; margin: 0; text-shadow: 0 0 15px #00ff33; }
        #boot-logo-1 p { font-family: Arial, sans-serif; font-size: 1rem; letter-spacing: 5px; color: #88a888; }
        #boot-logo-2 .diamond { width: 100px; height: 100px; background: #fff; transform: rotate(45deg); margin: 0 auto 40px; box-shadow: var(--white-glow); }
        #boot-logo-2 h2 { font-size: 2.5rem; letter-spacing: 15px; margin: 0; color: #000; font-weight: bold; }
        #boot-logo-2 p { color: #224422; letter-spacing: 4px; font-weight: bold; }

        /* --- RETRO TERMINAL AUTH SCREEN --- */
        #auth-screen {
            display: none; position: fixed; inset: 0; background: #020803; z-index: 900;
            align-items: center; justify-content: center; opacity: 0; transition: opacity 1s ease;
        }
        .auth-box {
            background: var(--panel-green); border: 3px solid var(--border-white); padding: 40px; width: 340px;
            box-shadow: var(--white-glow); display: flex; flex-direction: column; gap: 15px;
        }
        .auth-title {
            font-size: 1.3rem; color: #fff; text-align: center; letter-spacing: 3px;
            text-shadow: var(--white-glow); margin-bottom: 10px; font-weight: bold;
        }
        .auth-toggle-text { font-size: 0.8rem; color: #88a888; text-align: center; cursor: pointer; margin-top: 10px; }
        .auth-toggle-text span { color: #fff; text-decoration: underline; font-weight: bold; text-shadow: var(--white-glow); }
        .error-msg { color: #ff5555; font-size: 0.8rem; text-align: center; display: none; min-height: 20px; font-weight: bold; line-height: 1.2; }

        /* --- STEAM APPARATUS ENGINE APP LAYOUT --- */
        #app-root {
            display: none; height: 100vh; border: 4px solid var(--border-white); box-shadow: var(--white-glow); box-sizing: border-box; opacity: 0; transition: opacity 1.5s ease;
        }

        /* Sidebar Deck Components */
        .sidebar { width: 300px; background: var(--panel-green); border-right: 3px solid var(--border-white); display: flex; flex-direction: column; }
        
        .sidebar-header {
            background: var(--steam-header); padding: 15px; font-size: 1.3rem; font-weight: bold; color: #fff;
            border-bottom: 3px solid var(--border-white); text-shadow: var(--white-glow); text-align: center; letter-spacing: 3px;
        }
        
        .navigation-pane { flex: 1; overflow-y: auto; padding: 12px; }
        
        /* Steam Style User Profile Badge */
        .steam-profile-card {
            background: var(--steam-header); border: 2px solid var(--border-white); padding: 12px;
            display: flex; flex-direction: column; gap: 8px; box-shadow: var(--white-glow); margin-bottom: 15px;
        }
        .profile-meta { display: flex; align-items: center; gap: 10px; }
        .avatar-placeholder { width: 35px; height: 35px; border: 2px solid var(--border-white); background: var(--dark-green-bg); display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
        .identity-name { color: #fff; font-weight: bold; font-size: 1rem; text-shadow: var(--white-glow); overflow: hidden; text-overflow: ellipsis; }

        .section-title { font-size: 0.75rem; color: var(--terminal-green); text-transform: uppercase; letter-spacing: 2px; margin: 15px 0 8px 5px; text-shadow: var(--green-glow); font-weight: bold; }
        
        .nav-item {
            background: var(--steam-header); border: 1px solid rgba(255,255,255,0.2); padding: 10px 12px; margin-bottom: 8px;
            cursor: pointer; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; color: #a2bfa6; transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            color: #fff; border-color: var(--border-white); background: #0d2b12; transform: translateX(5px); box-shadow: var(--white-glow);
        }

        /* Steam Add Friend Interface Components */
        .add-friend-box { display: flex; gap: 5px; margin-bottom: 15px; }
        .add-friend-box input { flex: 1; background: #020803; border: 1px solid rgba(255,255,255,0.3); color: var(--terminal-green); padding: 8px; font-family: monospace; outline: none; }
        .add-friend-box input:focus { border-color: var(--border-white); }
        .add-friend-box button { background: var(--steam-header); border: 1px solid var(--border-white); color: #fff; cursor: pointer; padding: 0 12px; font-weight: bold; }
        .add-friend-box button:hover { background: #fff; color: #000; box-shadow: var(--white-glow); }

        /* Chat Frame Systems */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--dark-green-bg); position: relative; }
        .chat-header { background: var(--panel-green); padding: 15px; border-bottom: 3px solid var(--border-white); z-index: 1; display: flex; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .chat-header h2 { margin: 0; font-size: 1.2rem; color: #fff; letter-spacing: 1px; text-shadow: var(--white-glow); }

        #chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 1; }
        
        /* Tactical Grid Chat Component Layouts */
        .msg { background: var(--panel-green); border: 1px solid rgba(255,255,255,0.15); border-left: 4px solid var(--border-white); padding: 8px 15px; max-width: 75%; align-self: flex-start; display: flex; flex-direction: column; gap: 4px; box-shadow: 3px 3px 8px rgba(0,0,0,0.5); }
        .msg.own { align-self: flex-end; border-left: 1px solid rgba(255,255,255,0.15); border-right: 4px solid var(--border-white); text-align: right; background: #0e2d13; box-shadow: var(--white-glow); }
        .msg .username { font-size: 0.8rem; font-weight: bold; color: var(--terminal-green); letter-spacing: 1px; text-shadow: var(--green-glow); }
        .msg.own .username { color: #fff; text-shadow: var(--white-glow); }
        .msg .text { font-size: 1rem; color: #e2f0e4; word-wrap: break-word; line-height: 1.3; }

        /* Input Controls Footer Layout */
        .input-footer { padding: 20px; background: var(--panel-green); border-top: 3px solid var(--border-white); display: flex; gap: 10px; z-index: 1; box-shadow: 0 -4px 10px rgba(0,0,0,0.4); }
        .retro-input { background: #020803; border: 1px solid rgba(255,255,255,0.3); padding: 12px; color: var(--terminal-green); font-family: 'Courier New', Courier, monospace; outline: none; font-size: 1rem; }
        .retro-input:focus { border-color: var(--border-white); box-shadow: inset 0 0 8px rgba(255,255,255,0.2); }
        
        .retro-btn { background: var(--steam-header); border: 2px solid var(--border-white); color: #fff; padding: 10px 30px; font-weight: bold; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; transition: 0.1s; }
        .retro-btn:hover { background: #fff; color: #000; box-shadow: var(--white-glow); }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="crt">

<div id="boot-screen">
    <div id="press-start" onclick="startBootSequence()">INSERT DISC / PRESS START</div>
    <div id="boot-logo-1">
        <h1>A E R O</h1>
        <p>COMPUTER ENTERTAINMENT</p>
    </div>
    <div id="boot-logo-2">
        <div class="diamond"></div>
        <h2>AERO</h2>
        <p>LICENSED BY THE SYSTEM</p>
    </div>
</div>

<div id="auth-screen">
    <div class="auth-box">
        <div class="auth-title" id="auth-box-title">SYSTEM LOGIN</div>
        <div class="error-msg" id="auth-error-display"></div>
        
        <input type="text" id="auth-username" class="retro-input" placeholder="USERNAME" autocomplete="off">
        <input type="password" id="auth-password" class="retro-input" placeholder="PASSWORD">
        
        <button class="retro-btn" id="auth-submit-btn" onclick="processAuthSubmission()">EXECUTE</button>
        
        <div class="auth-toggle-text" id="auth-toggle-link" onclick="toggleAuthMode()">
            New user? <span>Create Account</span>
        </div>
    </div>
</div>

<div id="app-root">
    <div class="sidebar">
        <div class="sidebar-header">A E R O _ O S</div>
        
        <div class="navigation-pane">
            <div class="section-title">Identity Profile</div>
            <div class="steam-profile-card">
                <div class="profile-meta">
                    <div class="avatar-placeholder">🕹️</div>
                    <span class="identity-name" id="my-handle-display">Connecting...</span>
                </div>
                <button class="retro-btn" style="padding:4px; font-size:0.7rem; width:100%; border-color:rgba(255,255,255,0.4); color:#aaa; margin-top:5px;" onclick="terminateUserSession()">LOG OUT DECK</button>
            </div>

            <div class="section-title">Network</div>
            <div class="nav-item active" id="chan-global" onclick="switchChannel('global', 'GLOBAL HUB', true)">
                <span>🌐 GLOBAL HUB (EVERYBODY)</span>
            </div>

            <div class="section-title">Secure Comms (Friends)</div>
            <div class="add-friend-box">
                <input type="text" id="add-friend-input" placeholder="Target handle...">
                <button onclick="addFriend()">ADD</button>
            </div>
            <div id="friend-list-container"></div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <h2 id="active-channel-title">GLOBAL HUB</h2>
            <span style="color:var(--terminal-green); font-size:0.8rem; line-height: 1.5rem; text-shadow: var(--green-glow);">[ONLINE_DECK]</span>
        </div>
        <div id="chat-messages"></div>
        <div class="input-footer">
            <input type="text" id="message-box" class="retro-input" placeholder="Broadcast message stream..." style="flex: 1;">
            <button class="retro-btn" id="send-button">TX / SEND</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    /* =========================================================================
       1. FIREBASE CONFIGURATION MATRIX (CRITICAL BUG REPAIR COMPLETED HERE)
       ========================================================================= */
    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY", // <--- INSERT YOUR REAL FIREBASE API KEY HERE!
        authDomain: "aero-977a5.firebaseapp.com",
        databaseURL: "https://aero-977a5-default-rtdb.firebaseio.com/",
        projectId: "aero-977a5",
        storageBucket: "aero-977a5.appspot.com",
        messagingSenderId: "800936590653"
    };

    // Failsafe execution verification structure
    let firebaseActive = false;
    try {
        if (firebaseConfig.apiKey === "YOUR_FIREBASE_API_KEY") {
            console.warn("CRITICAL: Firebase configuration requires your valid apiKey parameter value!");
        }
        firebase.initializeApp(firebaseConfig);
        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION);
        firebaseActive = true;
    } catch (e) {
        console.error("Initialization Vector Failure:", e);
    }

    /* =========================================
       2. PS1 BOOT SEQUENCE AUDIO SYNTH REGISTRY
       ========================================= */
    const bootScreen = document.getElementById('boot-screen');
    const authScreen = document.getElementById('auth-screen');
    const appRoot = document.getElementById('app-root');
    const pressStart = document.getElementById('press-start');
    const logo1 = document.getElementById('boot-logo-1');
    const logo2 = document.getElementById('boot-logo-2');
    let bootCompleted = false;

    function playRetroSynth() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gainNode = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(52, ctx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(104, ctx.currentTime + 3);
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(155.56, ctx.currentTime); 

        gainNode.gain.setValueAtTime(0, ctx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 1);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 5);

        osc.connect(gainNode); osc2.connect(gainNode); gainNode.connect(ctx.destination);
        osc.start(); osc2.start(); osc.stop(ctx.currentTime + 5); osc2.stop(ctx.currentTime + 5);
    }

    function startBootSequence() {
        pressStart.style.display = 'none';
        playRetroSynth();
        logo1.style.display = 'block';
        setTimeout(() => logo1.style.opacity = '1', 100);

        setTimeout(() => {
            logo1.style.opacity = '0';
            bootScreen.style.backgroundColor = '#ffffff';
            setTimeout(() => {
                logo1.style.display = 'none';
                logo2.style.display = 'block';
                setTimeout(() => logo2.style.opacity = '1', 100);
            }, 1000);
        }, 3000);

        setTimeout(() => {
            bootScreen.style.opacity = '0';
            setTimeout(() => {
                bootScreen.style.display = 'none';
                bootCompleted = true;
                evaluateGlobalDisplayState();
            }, 2000);
        }, 7000);
    }

    /* =========================================
       3. ACCOUNT CONFIGURATION GATEWAY ROUTER
       ========================================= */
    let authModeIsLogin = true; 
    let myHandle = "";
    let myFriends = [];
    let currentChannel = "global";
    let activeListener = null;

    const authUsernameInput = document.getElementById('auth-username');
    const authPasswordInput = document.getElementById('auth-password');
    const authBoxTitle = document.getElementById('auth-box-title');
    const authToggleLink = document.getElementById('auth-toggle-link');
    const authErrorDisplay = document.getElementById('auth-error-display');
    const myHandleDisplay = document.getElementById('my-handle-display');
    const friendInput = document.getElementById('add-friend-input');
    const friendContainer = document.getElementById('friend-list-container');
    const chatMessages = document.getElementById('chat-messages');
    const messageBox = document.getElementById('message-box');
    const channelHeaderTitle = document.getElementById('active-channel-title');

    function toggleAuthMode() {
        authModeIsLogin = !authModeIsLogin;
        authErrorDisplay.style.display = "none";
        authUsernameInput.value = "";
        authPasswordInput.value = "";
        if (authModeIsLogin) {
            authBoxTitle.innerText = "SYSTEM LOGIN";
            authToggleLink.innerHTML = "New user? <span>Create Account</span>";
        } else {
            authBoxTitle.innerText = "CREATE ACCOUNT";
            authToggleLink.innerHTML = "Have account? <span>Sign In</span>";
        }
    }

    function showAuthError(msg) {
        authErrorDisplay.innerText = "ERROR: " + msg.toUpperCase();
        authErrorDisplay.style.display = "block";
    }

    function processAuthSubmission() {
        if (!firebaseActive) {
            showAuthError("Firebase engine configuration error. Missing API Key.");
            return;
        }
        const username = authUsernameInput.value.trim();
        const password = authPasswordInput.value;
        const cleanName = username.toLowerCase().replace(/[^a-zA-Z0-9_]/g, '');

        if (!cleanName || password.length < 6) {
            showAuthError("Incomplete data entry (Password min 6 characters).");
            return;
        }

        authErrorDisplay.style.display = "none";

        if (authModeIsLogin) {
            firebase.auth().signInWithEmailAndPassword(cleanName + "@aero.io", password)
                .catch(err => showAuthError("Access mapping denied. Check entry profile keys."));
        } else {
            const db = firebase.database();
            const reservationRef = db.ref('usernames/' + cleanName);
            reservationRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    showAuthError("Handle claimed by another active mainframe node.");
                } else {
                    firebase.auth().createUserWithEmailAndPassword(cleanName + "@aero.io", password)
                        .then((cred) => {
                            return reservationRef.set(cred.user.uid).then(() => {
                                return db.ref('users/' + cred.user.uid).set({ handle: username });
                            });
                        })
                        .catch(err => showAuthError(err.message));
                }
            });
        }
    }

    function terminateUserSession() {
        if(firebaseActive) {
            firebase.auth().signOut().then(() => { location.reload(); });
        }
    }

    /* =========================================
       4. PERSISTENCE PERSPECTIVE FRAME VIEW SHIFT
       ========================================= */
    function evaluateGlobalDisplayState() {
        if (!bootCompleted) return;
        
        // Failsafe handling window
        if (!firebaseActive || firebaseConfig.apiKey === "YOUR_FIREBASE_API_KEY") {
            authScreen.style.display = 'flex';
            authScreen.style.opacity = '1';
            showAuthError("Failsafe warning: Please update firebaseConfig with your real parameters inside the script block.");
            return;
        }

        const user = firebase.auth().currentUser;
        if (user) {
            authScreen.style.opacity = '0';
            appRoot.style.display = 'none';
            setTimeout(() => {
                authScreen.style.display = 'none';
                appRoot.style.display = 'flex';
                setTimeout(() => appRoot.style.opacity = '1', 100);
            }, 500);
        } else {
            appRoot.style.opacity = '0';
            setTimeout(() => {
                appRoot.style.display = 'none';
                authScreen.style.display = 'flex';
                setTimeout(() => authScreen.style.opacity = '1', 100);
            }, 500);
        }
    }

    if (firebaseActive) {
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                firebase.database().ref('users/' + user.uid + '/handle').once('value').then((snap) => {
                    myHandle = snap.val() || "Unknown_Entity";
                    myHandleDisplay.innerText = myHandle;
                    myFriends = JSON.parse(localStorage.getItem('aero_friends_' + user.uid) || '[]');
                    
                    evaluateGlobalDisplayState();
                    renderFriendList();
                    switchChannel('global', 'GLOBAL HUB', true);
                });
            } else {
                evaluateGlobalDisplayState();
            }
        });
    }

    /* =========================================
       5. CLIENT ROUTING MATRIX (FRIENDS & DMS)
       ========================================= */
    function addFriend() {
        const target = friendInput.value.trim().replace(/[^a-zA-Z0-9_]/g, '');
        if (!firebaseActive) return;
        const u = firebase.auth().currentUser;
        if (!target || target.toLowerCase() === myHandle.toLowerCase() || !u) return;

        if (!myFriends.includes(target)) {
            myFriends.push(target);
            localStorage.setItem('aero_friends_' + u.uid, JSON.stringify(myFriends));
            renderFriendList();
        }
        friendInput.value = '';
    }

    function removeFriend(target, e) {
        e.stopPropagation();
        if (!firebaseActive) return;
        const u = firebase.auth().currentUser;
        if(!u) return;
        myFriends = myFriends.filter(f => f !== target);
        localStorage.setItem('aero_friends_' + u.uid, JSON.stringify(myFriends));
        if(currentChannel.includes(target.toLowerCase())) switchChannel('global', 'GLOBAL HUB', true);
        renderFriendList();
    }

    function renderFriendList() {
        friendContainer.innerHTML = '';
        myFriends.forEach(friend => {
            const div = document.createElement('div');
            const dmRoomId = [myHandle.toLowerCase(), friend.toLowerCase()].sort().join('_');
            
            div.className = 'nav-item';
            div.id = `chan-${dmRoomId}`;
            div.innerHTML = `
                <span>👤 ${friend}</span>
                <span style="color:#ff5555; font-weight:bold; cursor:pointer;" onclick="removeFriend('${friend}', event)">[X]</span>
            `;
            div.onclick = () => switchChannel(`dm_${dmRoomId}`, `SECURE DM // ${friend.toUpperCase()}`, false);
            friendContainer.appendChild(div);
        });
    }

    function switchChannel(channelId, layoutTitle, isGlobal) {
        if (!firebaseActive) return;
        currentChannel = channelId;
        channelHeaderTitle.innerText = layoutTitle;
        channelHeaderTitle.style.color = isGlobal ? '#fff' : 'var(--terminal-green)';

        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if (isGlobal) {
            document.getElementById('chan-global').classList.add('active');
        } else {
            const node = document.getElementById(`chan-${channelId.replace('dm_', '')}`);
            if(node) node.classList.add('active');
        }

        chatMessages.innerHTML = '';
        const db = firebase.database();
        if (activeListener) {
            db.ref(`channels/${activeListener.path}`).off('child_added', activeListener.fn);
        }

        const listenerFn = db.ref(`channels/${channelId}`).on('child_added', (snapshot) => {
            renderMessage(snapshot.val());
        });
        activeListener = { path: channelId, fn: listenerFn };
    }

    function sendMessage() {
        if (!firebaseActive) return;
        const text = messageBox.value.trim();
        if (text === "") return;

        firebase.database().ref(`channels/${currentChannel}`).push({
            username: myHandle,
            text: text,
            timestamp: Date.now()
        });
        messageBox.value = '';
    }

    function renderMessage(data) {
        const msgDiv = document.createElement('div');
        const isOwn = data.username === myHandle;
        msgDiv.className = `msg ${isOwn ? 'own' : ''}`;
        msgDiv.innerHTML = `
            <div class="username">${data.username}</div>
            <div class="text">${data.text}</div>
        `;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    document.getElementById('send-button').addEventListener('click', sendMessage);
    messageBox.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
